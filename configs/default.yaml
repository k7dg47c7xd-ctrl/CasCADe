model:
  model_path: "models/Qwen2.5-3B-Instruct"
  max_len: 1024
  torch_dtype: "float16"
  trust_remote_code: true

lora:
  target_modules: ["q_proj","v_proj"]
  r: 8
  alpha: 16
  dropout: 0.05

data:
  data_path: "data/dataset"
  jsonl_path: "data/train.jsonl"
  val_ratio: 0.2

train:
  batch_size: 1
  eval_batch_size: 1
  epochs: 5
  lr: 1e-4
  gradient_accumulation_steps: 8
  seed: 42
  shuffle: true
  num_workers: 0
  log_every: 1
  max_grad_norm: 1.0

output:
  save_dir: "outputs/checkpoints"
  save_name: "qwen2_5_3b_lora.pt"
  log_dir: "outputs/logs"

llm:
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: gemma4-31b-it
  selection_timeout: 120
  generation_timeout: 180
  max_retries: 3
  retry_sleep_seconds: 5