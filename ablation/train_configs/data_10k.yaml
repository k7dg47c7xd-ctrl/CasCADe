### model
model_name_or_path: saves/base/Qwen3.6-27B  # Adjust to your local base-model path
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### qlora
quantization_bit: 4
quantization_method: bitsandbytes

### dataset
dataset: cad_train
template: qwen
cutoff_len: 4096
max_samples: 10000
preprocessing_num_workers: 8

### output
output_dir: saves/qwen3_6_27b/lora/data_10K
logging_steps: 1
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: sdpa
optim: paged_adamw_8bit
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
